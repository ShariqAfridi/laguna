name: Laguna VIBE Live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: 21098
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            cd /home/lagumobu/www/

            echo "Resetting local changes..."
            git reset --hard HEAD

            echo "Pulling latest code..."
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ShariqAfridi/laguna.git main

            echo "Deployment completed successfully."